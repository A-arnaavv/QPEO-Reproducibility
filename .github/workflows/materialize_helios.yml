name: materialize-helios-trace

on:
  push:
    branches: [main]
    paths:
      - "scripts/materialize_helios_trace.py"
      - ".github/workflows/materialize_helios.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify official Helios archive
        run: |
          mkdir -p audit/helios
          curl -fL https://raw.githubusercontent.com/S-Lab-System-Group/HeliosData/master/data.zip -o /tmp/helios.zip
          echo "3d22a5f6c0ae669e2fcbfe4200fa9c48664507bc397c677bad8f085222c032ac  /tmp/helios.zip" | sha256sum -c -
          unzip -q /tmp/helios.zip -d audit/helios
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize TRACE3
        run: python scripts/materialize_helios_trace.py
      - name: Commit snapshot and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/helios_earth_selected_128.csv configs/trace_helios_earth.json
          git commit -m "Lock Helios Earth TRACE3 snapshot"
          git push
