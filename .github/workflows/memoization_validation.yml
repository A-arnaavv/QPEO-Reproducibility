name: memoization-validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/memoization_validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        id: tests
        continue-on-error: true
        run: python -m pytest -q
      - name: Remove workflow if tests passed
        if: steps.tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memoization_validation.yml
          git commit -m "Remove completed memoization validation workflow"
          git push
      - name: Report validation status
        if: always()
        run: echo "memoization validation completed"