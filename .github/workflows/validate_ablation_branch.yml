name: one-time-ablation-branch-validation

on:
  push:
    branches: [ablation-study-prep]
    paths:
      - ".github/workflows/validate_ablation_branch.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ablation-study-prep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate QPEO ablations without running expensive experiments
        run: |
          python -m pytest -q tests/test_ablation_switches.py tests/test_optimizer.py tests/test_helios_roundoff_regression.py
      - name: Remove this one-time workflow after successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate_ablation_branch.yml
          git commit -m "Remove completed one-time ablation validation"
          git push origin HEAD:ablation-study-prep
