name: first-final-shard
# optimized memoized final execution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run_first_final_shard.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run first locked final shard
        id: shard
        continue-on-error: true
        run: |
          python scripts/run_final_experiment_shard.py \
            --scenario alibaba_gpu_v2023 \
            --seed-index 0 \
            --output-dir results/raw \
            --force
      - name: Validate and record result when successful
        if: always()
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('results/raw/alibaba_gpu_v2023__seed00_104729__final.json')
          if not p.exists():
              print('FINAL_SHARD_RESULT_MISSING')
              raise SystemExit(0)
          d=json.loads(p.read_text())
          ok=(d.get('final_protocol') is True and d.get('population_size')==50 and
              d.get('max_iterations')==500 and len(d.get('algorithms',[]))==13)
          if ok:
              for a in d['algorithms']:
                  if len(a.get('guide_objectives',[]))!=6:
                      ok=False
                  if not all(math.isfinite(float(x)) for x in a.get('guide_objectives',[])):
                      ok=False
          print('FINAL_SHARD_VALID=' + str(ok))
          if ok:
              Path('/tmp/qpeo_final_shard_valid').write_text('1')
          PY
      - name: Commit successful final shard and remove one-off workflow
        if: always()
        run: |
          set -e
          if [ -f /tmp/qpeo_final_shard_valid ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/raw/alibaba_gpu_v2023__seed00_104729__final.json
            git rm .github/workflows/run_first_final_shard.yml
            git commit -m "Add first locked final experiment shard"
            git push
          else
            echo "Shard did not validate; leaving workflow for inspection."
          fi
