name: seed0-canonical-implementation-parity

# One-time, source-triggered canonical rerun for three pre-tolerance seed-0 cohorts.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify_canonical_seed00.yml"

permissions:
  contents: read

jobs:
  rerun-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario:
          - alibaba_gpu_v2023
          - microsoft_elasticflow_itp_cluster08
          - alibaba_spot_gpu_2026_a100
    name: canonical seed-0 / ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d1efcf0980620e66db01b4d7c32d80081038471
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the exact pinned numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 scipy==1.17.1 pytest==9.2.0
      - name: Run full canonical 13-algorithm seed-0 shard
        env:
          SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7d1efcf0980620e66db01b4d7c32d80081038471"
          python scripts/run_final_experiment_shard.py \
            --scenario "$SCENARIO" \
            --seed-index 0 \
            --output-dir "$RUNNER_TEMP/qpeo-parity"
      - name: Validate provenance and preserve exact source commit
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import json, os, subprocess, math
          from pathlib import Path
          from scripts.audit_final_shards import validate_shard
          from qpeo.protocol import load_protocol
          p=Path(os.environ['RUNNER_TEMP'])/'qpeo-parity'/f"{os.environ['SCENARIO']}__seed00_104729__final.json"
          data=json.loads(p.read_text())
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual=='7d1efcf0980620e66db01b4d7c32d80081038471'
          data['git_sha']=actual
          data['seed0_parity_recheck']=True
          p.write_text(json.dumps(data,indent=2,allow_nan=False)+'\n')
          protocol=load_protocol('configs/reconstruction_protocol.json')[0]
          primary={'seeds':list(protocol.seeds),'population_size':protocol.population_size,
                   'max_iterations':protocol.max_iterations}
          validated=validate_shard(p,primary)
          assert len(data['algorithms'])==13
          assert all(len(a['guide_objective_history'])==501 for a in data['algorithms'])
          print('CANONICAL_SEED0_RECHECK_VALIDATED',validated['filename'],actual)
          PY
      - name: Back up canonical seed-0 rerun independently
        uses: actions/upload-artifact@v4
        with:
          name: qpeo-seed0-parity-${{ matrix.scenario }}
          path: ${{ runner.temp }}/qpeo-parity/*__final.json
          retention-days: 90
          if-no-files-found: error
