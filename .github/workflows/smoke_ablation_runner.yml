name: one-time-ablation-runner-smoke

on:
  push:
    branches: [ablation-study-prep]
    paths:
      - ".github/workflows/smoke_ablation_runner.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ablation-study-prep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run targeted branch tests
        run: python -m pytest -q tests/test_ablation_switches.py tests/test_ablation_runner.py tests/test_optimizer.py tests/test_final_runner_smoke.py
      - name: Delete this temporary workflow on success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/smoke_ablation_runner.yml
          git commit -m "Remove completed one-time ablation runner smoke workflow"
          git push origin HEAD:ablation-study-prep
