name: one-time-ablation-analysis-validation

on:
  push:
    branches: [ablation-study-prep]
    paths:
      - ".github/workflows/validate_ablation_analysis.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ablation-study-prep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify strict ablation pairing, statistics and operator switches
        run: |
          python -m pytest -q \
            tests/test_audit_ablation_shards.py \
            tests/test_analyze_ablation_results.py \
            tests/test_ablation_switches.py \
            tests/test_ablation_runner.py \
            tests/test_optimizer.py
      - name: Remove temporary test workflow after successful validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate_ablation_analysis.yml
          git commit -m "Remove completed one-time ablation analysis verification workflow"
          git push origin HEAD:ablation-study-prep
