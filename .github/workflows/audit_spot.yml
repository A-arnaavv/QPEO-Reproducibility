name: audit-alibaba-spot-trace
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_spot_trace.py"
      - ".github/workflows/audit_spot.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned trace
        run: |
          mkdir -p audit/spot
          curl -fL https://raw.githubusercontent.com/alibaba/clusterdata/3858992ca41bf92082e6d6522ddf0bebd14e838b/cluster-trace-v2026-spot-gpu/job_info_df.csv -o audit/spot/job_info_df.csv
          sha256sum audit/spot/job_info_df.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit
        run: python scripts/audit_spot_trace.py
