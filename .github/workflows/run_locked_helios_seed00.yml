name: run-locked-helios-seed00

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run_locked_helios_seed00.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run locked Helios seed-0 full-protocol experiment
        id: experiment
        run: |
          python scripts/run_final_experiment_shard.py \
            --scenario helios_earth \
            --seed-index 0 \
            --output-dir results/raw

      - name: Validate all 13 final algorithm results
        id: validate
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          f=Path('results/raw/helios_earth__seed00_104729__final.json')
          assert f.exists(), f
          d=json.loads(f.read_text())
          assert d['schema_version']=='qpeo-final-shard-v1'
          assert d['scenario']=='helios_earth'
          assert d['final_protocol'] is True
          assert d['seed_index']==0 and d['seed']==104729
          assert d['size']==64 and d['population_size']==50
          assert d['max_iterations']==500
          algos=d['algorithms']
          assert len(algos)==13
          expected={'QPEO','PSO','DE','GWO','WOA','ABC','GA','HS','FA','ACO','FPA','QIEA','NSGA-II'}
          assert {a['algorithm'] for a in algos}==expected
          for a in algos:
              assert len(a['guide_objectives'])==6
              assert all(math.isfinite(float(x)) for x in a['guide_objectives'])
              history=a['guide_objective_history']
              assert len(history)==501
              assert all(len(row)==6 and all(math.isfinite(float(x)) for x in row) for row in history)
              assert math.isfinite(float(a['runtime_seconds']))
          print('HELIOS_FINAL_SEED00_VALIDATED')
          PY

      - name: Upload immutable recovery artifact before git operations
        uses: actions/upload-artifact@v4
        with:
          name: helios_earth-seed00-final
          path: results/raw/helios_earth__seed00_104729__final.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit result with concurrent-update protection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/raw/helios_earth__seed00_104729__final.json
          git rm .github/workflows/run_locked_helios_seed00.yml
          git commit -m "Preserve locked Helios seed-0 full-protocol result"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "REBASE_CONFLICT: run artifact is retained; do not force-push."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "HELIOS_FINAL_SEED00_COMMITTED"
              exit 0
            fi
          done
          echo "PUSH_FAILED: results remain in 30-day GitHub artifact."
          exit 1
