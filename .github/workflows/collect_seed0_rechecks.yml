name: collect-seed0-canonical-rechecks

on:
  workflow_run:
    workflows: ["seed0-canonical-implementation-parity"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  compare-and-preserve:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Download three canonical seed-0 results
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: qpeo-seed0-parity-*
          merge-multiple: true
          path: ${{ runner.temp }}/seed0-rechecks
      - name: Compare all 501 objective-history rows and preserve previous source versions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_seed0_revision.py \
            --canonical-dir "$RUNNER_TEMP/seed0-rechecks"
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path('.')
          report=json.loads(Path('results/reproducibility/seed00_parity.json').read_text())
          if report['count'] != 3:
              raise SystemExit('Expected exactly three canonical source-revision checks')
          archive=Path('results/reproducibility/precanonical_seed00')
          archive.mkdir(parents=True,exist_ok=True)
          for scenario in (
              'alibaba_gpu_v2023',
              'microsoft_elasticflow_itp_cluster08',
              'alibaba_spot_gpu_2026_a100',
          ):
              filename=f'{scenario}__seed00_104729__final.json'
              original=Path('results/raw')/filename
              updated=Path(__import__('os').environ['RUNNER_TEMP'])/'seed0-rechecks'/filename
              assert original.exists() and updated.exists()
              shutil.copy2(original,archive/filename)
              shutil.copy2(updated,original)
          print('SEED0_SOURCE_ALIGNMENT',report['all_three_equivalent'])
          PY
          python scripts/audit_final_shards.py
      - name: Preserve canonical and original results with safe retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/raw results/reproducibility results/final_shard_audit.json
          git rm .github/workflows/verify_canonical_seed00.yml
          git rm .github/workflows/collect_seed0_rechecks.yml
          git commit -m "Align earlier seed-0 results with canonical experiment source and archive originals"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'REBASE_CONFLICT: canonical reruns remain as independent Actions artifacts.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'SEED0_CANONICAL_RESULTS_SAVED'
              exit 0
            fi
          done
          echo 'PUSH_FAILED: original data unchanged, rechecks retained in Actions'
          exit 1
