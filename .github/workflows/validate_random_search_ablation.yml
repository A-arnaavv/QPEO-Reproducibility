name: one-time-random-search-and-ablation-validation

on:
  push:
    branches: [ablation-study-prep]
    paths:
      - ".github/workflows/validate_random_search_ablation.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ablation-study-prep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate random search and full ablation analysis
        run: |
          python -m pytest -q \
            tests/test_random_search.py \
            tests/test_ablation_runner.py \
            tests/test_audit_ablation_shards.py \
            tests/test_analyze_ablation_results.py \
            tests/test_ablation_switches.py
      - name: Remove one-time workflow after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate_random_search_ablation.yml
          git commit -m "Remove completed one-time ablation random-search checks"
          git push origin HEAD:ablation-study-prep
