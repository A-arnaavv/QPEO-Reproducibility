name: recover-seed0-artifacts-and-check-roundoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover_seed0_artifacts.yml"

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Verify capacity roundoff fix
        shell: bash
        run: |
          if python -m pytest -q tests/test_simulator.py; then
            touch /tmp/qpeo_tests_pass
            echo 'REGRESSION_PASS'
          else
            echo 'REGRESSION_FAIL; artifacts will not be committed'
          fi
      - name: Recover previous full-scale results (no rerun)
        uses: actions/download-artifact@v4
        with:
          run-id: 42829749262
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: seed0-*
          merge-multiple: true
          path: /tmp/seed0-recovered
      - name: Validate recovered JSON files
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          names=[
              'microsoft_elasticflow_itp_cluster08',
              'alibaba_spot_gpu_2026_a100',
          ]
          src=Path('/tmp/seed0-recovered')
          dst=Path('results/raw')
          dst.mkdir(parents=True,exist_ok=True)
          valid=True
          for name in names:
              filename=f'{name}__seed00_104729__final.json'
              path=src/filename
              if not path.exists():
                  print('MISSING',path)
                  valid=False
                  continue
              d=json.loads(path.read_text())
              a=d.get('algorithms',[])
              correct=(d.get('scenario')==name and d.get('seed')==104729
                  and d.get('seed_index')==0 and d.get('size')==64
                  and d.get('population_size')==50 and d.get('max_iterations')==500
                  and d.get('final_protocol') is True and len(a)==13
                  and len({x['algorithm'] for x in a})==13
                  and all(len(x['guide_objectives'])==6
                  and all(math.isfinite(float(v)) for v in x['guide_objectives'])
                  for x in a))
              if correct:
                  (dst/filename).write_bytes(path.read_bytes())
                  print('RECOVERED',filename)
              else:
                  valid=False
                  print('INVALID',filename)
          if valid: Path('/tmp/qpeo_recovery_valid').write_text('1')
          PY
      - name: Commit valid recovered artifacts without race condition
        shell: bash
        run: |
          if [ ! -f /tmp/qpeo_tests_pass ] || [ ! -f /tmp/qpeo_recovery_valid ]; then
            echo 'NOT_COMMITTED: tests or recovered JSON validation failed'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/raw/microsoft_elasticflow_itp_cluster08__seed00_104729__final.json
          git add results/raw/alibaba_spot_gpu_2026_a100__seed00_104729__final.json
          git rm .github/workflows/recover_seed0_artifacts.yml
          git commit -m "Preserve validated full-scale seed-0 artifacts and remove recovery workflow"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'REBASE_CONFLICT: manual inspection needed'
              exit 0
            fi
            if git push origin HEAD:main; then
              echo 'ARTIFACT_COMMIT_SUCCESS'
              exit 0
            fi
            echo "PUSH_RETRY $attempt"
          done
          echo 'PUSH_UNSUCCESSFUL: no data altered on main'
