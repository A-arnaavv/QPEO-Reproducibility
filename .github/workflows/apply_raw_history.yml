name: apply-raw-history-migration

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_raw_history_patch.py"
      - ".github/workflows/apply_raw_history.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply tested migration
        run: python scripts/apply_raw_history_patch.py
      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qpeo/baseline_common.py qpeo/baselines.py qpeo/optimizer.py tests/test_optimizer.py tests/test_baselines.py tests/test_original_baselines.py
          git commit -m "Record raw objective histories for convergence analysis"
          git push
