name: fetch-locked-neso-week
on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_locked_neso_week.py"
      - ".github/workflows/fetch_locked_neso_week.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch locked 2026 NESO week
        run: python scripts/fetch_locked_neso_week.py
      - name: Commit locked carbon replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carbon/neso_regional_2026-01-05_2026-01-11.csv data/carbon/neso_regional_2026-01-05_2026-01-11_raw.json
          git commit -m "Snapshot locked 2026 NESO carbon replay"
          git push
