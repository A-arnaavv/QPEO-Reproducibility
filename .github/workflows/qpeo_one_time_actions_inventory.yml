name: qpeo-one-time-actions-inventory

# Read-only audit of previous Actions runs. No optimizer execution.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qpeo_one_time_actions_inventory.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory batch and canonical parity Actions runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return {"not_found": True}
                  raise

          def all_pages(url, key, max_pages=5):
              data = []
              for page in range(1, max_pages + 1):
                  sep = "&" if "?" in url else "?"
                  response = get(f"{url}{sep}per_page=100&page={page}")
                  if response.get("not_found"):
                      return data, True
                  items = response.get(key, [])
                  data.extend(items)
                  if len(items) < 100:
                      break
              return data, False

          workflows = {
              "primary_batch": "locked_final_parallel_batch.yml",
              "primary_collector": "collect_completed_final_batch.yml",
              "seed0_parity": "verify_canonical_seed00.yml",
              "seed0_collector": "collect_seed0_rechecks.yml",
          }
          report = {
              "purpose": "Read-only inventory of GitHub Actions outcomes and retained artifacts; no experiments executed",
              "repository": repo,
              "workflows": {},
          }
          for key, filename in workflows.items():
              runs, missing = all_pages(f"{base}/actions/workflows/{filename}/runs", "workflow_runs", 2)
              item = {"workflow_filename": filename, "workflow_not_found": missing, "runs_found_in_first_200": len(runs), "recent_runs": []}
              for run in runs[:5]:
                  entry = {k: run.get(k) for k in ("id", "name", "status", "conclusion", "event", "head_sha", "created_at", "updated_at", "html_url")}
                  artifacts, unavailable = all_pages(f"{base}/actions/runs/{run['id']}/artifacts", "artifacts", 3)
                  entry["artifacts_unavailable"] = unavailable
                  entry["artifact_count"] = len(artifacts)
                  entry["artifact_names"] = [a.get("name") for a in artifacts]
                  if key == "primary_batch":
                      scenarios = ("alibaba_gpu_v2023", "microsoft_elasticflow_itp_cluster08", "helios_earth", "alibaba_spot_gpu_2026_a100")
                      expected = {(scenario, seed) for scenario in scenarios for seed in range(1, 30)}
                      present = set()
                      for artifact in artifacts:
                          artifact_name = artifact.get("name", "")
                          for scenario in scenarios:
                              prefix = f"qpeo-final-{scenario}-seed"
                              if artifact_name.startswith(prefix):
                                  try:
                                      seed = int(artifact_name[len(prefix):])
                                      if 1 <= seed <= 29 and not artifact.get("expired"):
                                          present.add((scenario, seed))
                                  except ValueError:
                                      pass
                      entry["batch_expected"] = len(expected)
                      entry["batch_artifact_seed_count"] = len(present)
                      entry["missing_artifact_seeds_by_scenario"] = {
                          scenario: [seed for seed in range(1, 30) if (scenario, seed) not in present]
                          for scenario in scenarios
                      }
                  entry["expired_artifact_count"] = sum(bool(a.get("expired")) for a in artifacts)
                  if key in ("primary_batch", "seed0_parity"):
                      jobs, _ = all_pages(f"{base}/actions/runs/{run['id']}/jobs", "jobs", 3)
                      entry["jobs_inspected"] = len(jobs)
                      entry["jobs_by_conclusion"] = {}
                      entry["unsuccessful_jobs"] = []
                      for job in jobs:
                          status = job.get("conclusion") or job.get("status") or "unknown"
                          entry["jobs_by_conclusion"][status] = entry["jobs_by_conclusion"].get(status, 0) + 1
                          if status not in ("success",):
                              entry["unsuccessful_jobs"].append({"name": job.get("name"), "status": status, "html_url": job.get("html_url")})
                  item["recent_runs"].append(entry)
              report["workflows"][key] = item

          path = Path("results/reproducibility/actions_inventory.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          for key, entry in report["workflows"].items():
              print(key, [(run["id"], run["conclusion"], run["artifact_count"]) for run in entry["recent_runs"]])
          PY
      - name: Preserve inventory without changing experimental files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/reproducibility/actions_inventory.json
          git diff --cached --quiet && exit 0
          git commit -m "Record read-only Actions status and artifact inventory"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
