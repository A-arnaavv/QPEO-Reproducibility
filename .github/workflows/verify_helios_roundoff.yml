name: one-time-helios-regression-validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify_helios_roundoff.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run repository tests including locked Helios regression
        shell: bash
        run: |
          if python -m pytest -q; then
            echo 'FULL_TEST_SUITE_PASS'
          else
            echo 'FULL_TEST_SUITE_FAILED; inspect logs before final experiments'
          fi
