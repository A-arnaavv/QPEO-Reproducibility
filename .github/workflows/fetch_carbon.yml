name: fetch-fixed-carbon-snapshot
on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_neso_carbon_profiles.py"
      - ".github/workflows/fetch_carbon.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch fixed NESO profiles
        run: python scripts/fetch_neso_carbon_profiles.py
      - name: Commit carbon snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carbon/neso_regional_2025-01-15.csv data/carbon/neso_regional_2025-01-15_raw.json
          git commit -m "Snapshot fixed NESO regional carbon profiles"
          git push
