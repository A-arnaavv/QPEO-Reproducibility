name: apply-dynamic-carbon-migration

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_dynamic_carbon_patch.py"
      - ".github/workflows/apply_dynamic_carbon.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply tested dynamic-carbon migration
        run: python scripts/apply_dynamic_carbon_patch.py
      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qpeo/baselines.py qpeo/optimizer.py qpeo/experiment.py
          git commit -m "Apply dynamic carbon replay to all optimizers"
          git push
